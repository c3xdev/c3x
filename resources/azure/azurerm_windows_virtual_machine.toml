kind         = "azurerm_windows_virtual_machine"
display_name = "Azure Windows Virtual Machine"
provider     = "azure"

# Azure's catalogue surfaces Linux and Windows variants of the same SKU
# under different `productName` values (e.g. "Virtual Machines Dsv5 Series"
# vs "Virtual Machines Dsv5 Series Windows"). The skuName attribute alone
# is identical between the two, so without a productName filter we'd pick
# whichever the upstream returns first — historically Linux, producing a
# silently-wrong Windows estimate.
#
# Today's compromise: hard-code productName for the Dsv5 family because
# that's the default the test fixture uses and the most common general-
# purpose SKU. Other families (Ev5, NCv3, M-series, …) currently fall
# back to the Linux-first match. Tracked in CATALOG_STATUS.md as the
# "Windows OS dispatch" item; a richer pick()-driven mapping or a
# client-side productName regex (when the upstream gains regex support)
# is the long-term fix.

[mappings.compute_dsv5]
service        = "Virtual Machines"
product_family = "Compute"
attribute_filters = [
  { key = "skuName", expr = 'default(size, "Standard_D2s_v5")' },
  { key = "os",      const = "Windows" },
]

[[dimensions]]
id       = "compute_hours"
label    = "Virtual machine (Windows, Dsv5)"
unit     = "hours"
quantity = "monthly_hours()"
rate     = 'price("compute_dsv5")'

# Managed disks bill a flat monthly price per size tier: the smallest tier
# that holds disk_size_gb (P/E 1, 2, 3, 4, 6, 10, 15, 20, 30, 40, 50, 60,
# 70, 80 for 4 GiB .. 32 TiB; Standard HDD starts at S4 = 32 GiB).
# storage_account_type picks the family and redundancy:
#   Premium_LRS / Premium_ZRS          Premium SSD   (P, LRS / ZRS)
#   StandardSSD_LRS / StandardSSD_ZRS  Standard SSD  (E, LRS / ZRS)
#   Standard_LRS                       Standard HDD  (S, LRS)
# PremiumV2_LRS and UltraSSD_LRS bill per GiB, IOPS and throughput instead
# of by tier and are not priced here. Standard HDD and Standard SSD
# transaction charges are usage-driven and not modelled.
#
# When os_disk.disk_size_gb is unset the disk takes the size of the
# image. It is assumed to be 127 GiB, the size of the common Windows
# marketplace images, which lands in tier 10 (128 GiB).
[mappings.os_disk]
service        = "Storage"
product_family = "Storage"
attribute_filters = [
  { key = "meterName", expr = '''
      let t = default(os_disk_storage_account_type, "Premium_LRS");
      let gb = default(os_disk_disk_size_gb, 127);
      let fam = t startsWith "Premium" ? "P" : t startsWith "StandardSSD" ? "E" : "S";
      let n =
        gb <= 4     ? 1  : gb <= 8     ? 2  : gb <= 16    ? 3  : gb <= 32   ? 4  :
        gb <= 64    ? 6  : gb <= 128   ? 10 : gb <= 256   ? 15 : gb <= 512  ? 20 :
        gb <= 1024  ? 30 : gb <= 2048  ? 40 : gb <= 4096  ? 50 : gb <= 8192 ? 60 :
        gb <= 16384 ? 70 : 80;
      fam + string(fam == "S" && n < 4 ? 4 : n) + " " +
      (t endsWith "_ZRS" ? "ZRS" : "LRS") + " Disk"
  ''' },
  { key = "productName", expr = '''
      let t = default(os_disk_storage_account_type, "Premium_LRS");
      t startsWith "Premium"     ? "Premium SSD Managed Disks" :
      t startsWith "StandardSSD" ? "Standard SSD Managed Disks" :
                                   "Standard HDD Managed Disks"
  ''' },
]

[[dimensions]]
id       = "os_disk"
label    = "OS disk (managed)"
unit     = "disk-months"
when     = 'default(os_disk_storage_account_type, "Premium_LRS") in ["Premium_LRS", "Premium_ZRS", "StandardSSD_LRS", "StandardSSD_ZRS", "Standard_LRS"]'
quantity = "1"
rate     = 'price("os_disk")'

[fixture]
# Standard_D2s_v5 Windows $0.188/hr x 730 = 137.24, plus a Premium SSD OS
# disk of the default 127 GiB image size, billed as P10: $19.71/month
# (https://azure.microsoft.com/en-us/pricing/details/managed-disks/,
# meter "P10 LRS Disk" in the Azure Retail Prices API). Total 156.95.
attributes = { size = "Standard_D2s_v5", os_disk_storage_account_type = "Premium_LRS" }
expected_monthly_cost = 156.95
tolerance = 0.05

