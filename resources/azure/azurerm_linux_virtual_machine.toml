kind         = "azurerm_linux_virtual_machine"
display_name = "Azure Linux Virtual Machine"
provider     = "azure"

# Match the canonical "regular" pricing for Linux VMs by filtering against
# the meterName that has no Spot/Low Priority suffix. Note: the upstream
# returns both Linux and Windows variants for a given skuName — without a
# productName filter we may pick the first match. In practice Linux is
# the first hit, but a richer rule (productName containing the family
# suffix vs " Windows") would be more robust. Tracked in CATALOG_STATUS.

[mappings.compute]
service        = "Virtual Machines"
product_family = "Compute"
attribute_filters = [
  { key = "skuName", expr = 'default(size, "Standard_D2s_v5")' },
  { key = "os", const = "Linux" },
]

[[dimensions]]
id       = "compute_hours"
label    = "Virtual machine"
unit     = "hours"
quantity = "monthly_hours()"
rate     = 'price("compute")'

# Managed disks bill a flat monthly price per size tier: the smallest tier
# that holds disk_size_gb (P/E 1, 2, 3, 4, 6, 10, 15, 20, 30, 40, 50, 60,
# 70, 80 for 4 GiB .. 32 TiB; Standard HDD starts at S4 = 32 GiB).
# storage_account_type picks the family and redundancy:
#   Premium_LRS / Premium_ZRS          Premium SSD   (P, LRS / ZRS)
#   StandardSSD_LRS / StandardSSD_ZRS  Standard SSD  (E, LRS / ZRS)
#   Standard_LRS                       Standard HDD  (S, LRS)
# PremiumV2_LRS and UltraSSD_LRS bill per GiB, IOPS and throughput instead
# of by tier and are not priced here. Standard HDD and Standard SSD
# transaction charges are usage-driven and not modelled.
#
# When os_disk.disk_size_gb is unset the disk takes the size of the
# image. It is assumed to be 30 GiB, the size of the common Linux
# marketplace images, which lands in tier 4 (32 GiB).
[mappings.os_disk]
service        = "Storage"
product_family = "Storage"
attribute_filters = [
  { key = "meterName", expr = '''
      let t = default(os_disk_storage_account_type, "Premium_LRS");
      let gb = default(os_disk_disk_size_gb, 30);
      let fam = t startsWith "Premium" ? "P" : t startsWith "StandardSSD" ? "E" : "S";
      let n =
        gb <= 4     ? 1  : gb <= 8     ? 2  : gb <= 16    ? 3  : gb <= 32   ? 4  :
        gb <= 64    ? 6  : gb <= 128   ? 10 : gb <= 256   ? 15 : gb <= 512  ? 20 :
        gb <= 1024  ? 30 : gb <= 2048  ? 40 : gb <= 4096  ? 50 : gb <= 8192 ? 60 :
        gb <= 16384 ? 70 : 80;
      fam + string(fam == "S" && n < 4 ? 4 : n) + " " +
      (t endsWith "_ZRS" ? "ZRS" : "LRS") + " Disk"
  ''' },
  { key = "productName", expr = '''
      let t = default(os_disk_storage_account_type, "Premium_LRS");
      t startsWith "Premium"     ? "Premium SSD Managed Disks" :
      t startsWith "StandardSSD" ? "Standard SSD Managed Disks" :
                                   "Standard HDD Managed Disks"
  ''' },
]

[[dimensions]]
id       = "os_disk"
label    = "OS disk (managed)"
unit     = "disk-months"
when     = 'default(os_disk_storage_account_type, "Premium_LRS") in ["Premium_LRS", "Premium_ZRS", "StandardSSD_LRS", "StandardSSD_ZRS", "Standard_LRS"]'
quantity = "1"
rate     = 'price("os_disk")'

[fixture]
# Standard_D2s_v5 Linux $0.096/hr x 730 = 70.08, plus a Premium SSD OS disk
# of the default 30 GiB image size, billed as P4: $5.28/month
# (https://azure.microsoft.com/en-us/pricing/details/managed-disks/,
# meter "P4 LRS Disk" in the Azure Retail Prices API). Total 75.36.
attributes = { size = "Standard_D2s_v5", os_disk_storage_account_type = "Premium_LRS" }
expected_monthly_cost = 75.36
tolerance = 0.05

