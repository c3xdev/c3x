kind         = "aws_dms_replication_instance"
display_name = "AWS DMS Replication Instance"
provider     = "aws"

# DMS bills per replication-instance-hour and per-GB-month of storage.
# The single-AZ vs multi-AZ split applies to the instance fee.

# The upstream catalog stores DMS instances under productFamily
# "Replication Server" and exposes the deployment mode via
# `availabilityZone` ("Single" / "Multiple"). `instanceType` is the
# bare EC2 type ("t3.micro"), so we strip the `dms.` prefix from the
# Terraform value.

[mappings.instance_single_az]
service        = "AWSDatabaseMigrationSvc"
product_family = "Replication Server"
attribute_filters = [
  { key = "instanceType",     expr = 'strip_prefix(default(replication_instance_class, "dms.t3.micro"), "dms.")' },
  { key = "availabilityZone", const = "Single" },
]

[mappings.instance_multi_az]
service        = "AWSDatabaseMigrationSvc"
product_family = "Replication Server"
attribute_filters = [
  { key = "instanceType",     expr = 'strip_prefix(default(replication_instance_class, "dms.t3.micro"), "dms.")' },
  { key = "availabilityZone", const = "Multiple" },
]

# Storage rows carry no deploymentOption; Single/Multi-AZ is the same
# `availabilityZone` attribute the instance rows use.
[mappings.storage]
service        = "AWSDatabaseMigrationSvc"
product_family = "Replication Storage"
attribute_filters = [
  { key = "availabilityZone", expr = 'pick(default(multi_az, false), "Multiple", "Single")' },
]

[[dimensions]]
id       = "instance_hours"
label    = "Replication instance"
unit     = "hours"
quantity = "monthly_hours()"
rate     = 'pick(default(multi_az, false), price("instance_multi_az"), price("instance_single_az"))'

# Every replication instance includes GP2 storage: 50 GB on the
# burstable T classes, 100 GB on the C and R classes. Only storage
# above that is billed, so an instance at the included size (or with
# allocated_storage unset, which AWS defaults to the included size)
# has no storage line.
[[dimensions]]
id       = "storage"
label    = "Storage (beyond included)"
unit     = "GB-month"
when     = '''
  default(allocated_storage, 0) >
  (strip_prefix(default(replication_instance_class, "dms.t3.micro"), "dms.") startsWith "t" ? 50 : 100)
'''
quantity = '''
  default(allocated_storage, 0) -
  (strip_prefix(default(replication_instance_class, "dms.t3.micro"), "dms.") startsWith "t" ? 50 : 100)
'''
rate     = 'price("storage")'

[fixture]
# us-east-1: dms.t3.micro 730 h x $0.0186 + (100 - 50 included) GB x
# $0.115 = $19.328 (https://aws.amazon.com/dms/pricing/)
attributes = { allocated_storage = 100, multi_az = false, replication_instance_class = "dms.t3.micro" }
expected_monthly_cost = 19.33
tolerance = 0.05

