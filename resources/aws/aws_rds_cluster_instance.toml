kind         = "aws_rds_cluster_instance"
display_name = "AWS Aurora Cluster Instance"
provider     = "aws"

# Aurora cluster INSTANCES bill per-hour by instance class. The
# storage + I/O is on the parent `aws_rds_cluster` resource — keeping
# the two separate matches Terraform's resource shape and avoids
# double-counting.

# Aurora publishes two instance SKUs per class: Aurora Standard
# ("EBS Only") and Aurora I/O-Optimized ("Aurora IO Optimization Mode"),
# the latter roughly 30% dearer per hour in exchange for no I/O charges.
# Both carry the same instanceType, databaseEngine and deploymentOption,
# so without the `storage` discriminator the lookup matched both and the
# max-non-zero picker always returned the I/O-Optimized rate, overcharging
# every Aurora Standard cluster by ~30%.
#
# `storage` is used rather than `usagetype` on purpose: usagetype carries
# a region prefix outside us-east-1 (EU-InstanceUsage:db.r6g.large), so
# pinning it would match nothing in most regions.
#
# storage_type is declared on the parent aws_rds_cluster, not here. The
# parser copies it onto the instance (internal/parser/inherit.go) so this
# filter can stay on a plain attribute read, which every released client
# understands: the catalog is fetched remote-first, so an expression using
# a newer engine feature would break older clients outright. An instance
# that declares storage_type itself keeps its own value, and when neither
# is present the default is Aurora Standard: the common case, and the
# safer way to be wrong.
[mappings.instance]
service        = "AmazonRDS"
product_family = "Database Instance"
attribute_filters = [
  { key = "instanceType",   expr = 'default(instance_class, "db.r6g.large")' },
  { key = "databaseEngine", expr = '''
      pick(default(engine, "aurora-postgresql") == "aurora-mysql", "Aurora MySQL",
      "Aurora PostgreSQL")
  ''' },
  { key = "deploymentOption", const = "Single-AZ" },
  { key = "storage", expr = '''
      pick(default(storage_type, "") == "aurora-iopt1",
      "Aurora IO Optimization Mode", "EBS Only")
  ''' },
]

[[dimensions]]
id       = "instance_hours"
label    = "Aurora instance"
unit     = "hours"
quantity = "monthly_hours()"
rate     = 'price("instance")'

[fixture]
# Aurora Standard: $0.26/hr x 730. The old expectation of 246.74 was the
# I/O-Optimized rate ($0.338/hr), which is what the ambiguous filter had
# been returning for every cluster.
attributes = { engine = "aurora-postgresql", instance_class = "db.r6g.large" }
expected_monthly_cost = 189.80
tolerance = 0.05
