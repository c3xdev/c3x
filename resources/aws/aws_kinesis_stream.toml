kind         = "aws_kinesis_stream"
display_name = "AWS Kinesis Data Stream"
provider     = "aws"

[mappings.shard]
service        = "AmazonKinesis"
product_family = "Kinesis Streams"
attribute_filters = [
  { key = "group", const = "Provisioned shard hour" },
]

[mappings.put_payload]
service        = "AmazonKinesis"
product_family = "Kinesis Streams"
attribute_filters = [
  { key = "group", const = "Payload Units" },
]

[[dimensions]]
id       = "shard_hours"
label    = "Shard provisioning"
unit     = "shard-hours"
when     = 'default(stream_mode_details_stream_mode, "PROVISIONED") == "PROVISIONED"'
quantity = "default(shard_count, 1) * monthly_hours()"
rate     = 'price("shard")'

[[dimensions]]
id       = "put_units"
label    = "PUT payload units"
unit     = "1M units"
quantity = "default(monthly_put_payload_units, 0) / 1000000"
# The upstream rate is per single payload unit ($0.000000014); the line
# is priced per million units.
rate     = 'price("put_payload") * 1000000'

[fixture]
# us-east-1: 2 shards x 730 h x $0.015 + 1M PUT payload units x $0.014
# per million = $21.914 (https://aws.amazon.com/kinesis/data-streams/pricing/)
attributes = { monthly_put_payload_units = 1_000_000, shard_count = 2 }
expected_monthly_cost = 21.91
tolerance = 0.05

