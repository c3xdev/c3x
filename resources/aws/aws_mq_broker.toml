kind         = "aws_mq_broker"
display_name = "AWS MQ Broker"
provider     = "aws"

# Amazon MQ bills per broker-instance-hour (varies by engine,
# deployment mode, and instance type) and per-GB-month of storage.
# Engine families:
#   - ActiveMQ (default)
#   - RabbitMQ
# Deployment modes:
#   - SINGLE_INSTANCE (1 broker)
#   - ACTIVE_STANDBY_MULTI_AZ (ActiveMQ, 2 brokers)
#   - CLUSTER_MULTI_AZ (RabbitMQ, 3 brokers)

[mappings.broker]
service        = "AmazonMQ"
product_family = "Broker Instances"
attribute_filters = [
  { key = "brokerEngine", expr = '''
      pick(default(engine_type, "ActiveMQ") == "RabbitMQ", "RabbitMQ", "ActiveMQ")
  ''' },
  # host_instance_type comes from Terraform as "mq.t3.micro"; the
  # upstream catalog stores `instanceType` as the bare "t3.micro".
  { key = "instanceType", expr = '''
      replace(default(host_instance_type, "mq.t3.micro"), "mq.", "")
  ''' },
  { key = "deploymentOption", expr = '''
      pick(default(deployment_mode, "SINGLE_INSTANCE") == "SINGLE_INSTANCE", "Single-AZ", "Multi-AZ")
  ''' },
]

# Storage rows carry no storageMedia; the usagetype names the storage:
#   ActiveMQ, EFS (durability optimized, the default): TimedStorage-ByteHrs
#   ActiveMQ, EBS (throughput optimized, mq.m5 only):  TimedStorage-EBS-ByteHrs
#   RabbitMQ (always EBS):                             TimedStorage-RabbitMQ-ByteHrs
# The EFS row's deploymentOption says "Multi-AZ" but it bills single
# instance brokers too. AWS publishes no EFS row in some regions
# (eu-west-1 among them); there the engine quotes the us-east-1 rate
# with a region_fallback caveat.
[mappings.storage]
service        = "AmazonMQ"
product_family = "Broker Storage"
attribute_filters = [
  { key = "usagetype", expr = '''
      default(engine_type, "ActiveMQ") == "RabbitMQ" ? "USE1-TimedStorage-RabbitMQ-ByteHrs" :
      lower(default(storage_type, "efs")) == "ebs" ? "USE1-TimedStorage-EBS-ByteHrs" :
      "USE1-TimedStorage-ByteHrs"
  ''' },
]

[[dimensions]]
id       = "broker_hours"
label    = "Broker instance"
unit     = "hours"
quantity = '''
  pick(default(deployment_mode, "SINGLE_INSTANCE") == "SINGLE_INSTANCE", 1,
  pick(default(deployment_mode, "SINGLE_INSTANCE") == "CLUSTER_MULTI_AZ", 3, 2)) * monthly_hours()
'''
rate     = 'price("broker")'

[[dimensions]]
id       = "storage"
label    = "Broker storage"
unit     = "GB-month"
quantity = "default(storage_size_gb, 20)"
rate     = 'price("storage")'

[fixture]
# us-east-1: mq.t3.micro ActiveMQ 730 h x $0.02704 + 20 GB EFS x $0.30
# = $25.739 (https://aws.amazon.com/amazon-mq/pricing/)
attributes = { deployment_mode = "SINGLE_INSTANCE", engine_type = "ActiveMQ", host_instance_type = "mq.t3.micro", storage_size_gb = 20 }
expected_monthly_cost = 25.74
tolerance = 0.05

