# Composite GitHub Action: install c3x and (optionally) run an
# estimate + PR comment in one step.
#
# On a pull request the comment shows the cost DELTA versus the base
# branch ("Total: $533/mo -> $1,038/mo +$505") — the Action estimates
# the base branch automatically. On a push (no base) it shows the
# absolute total.
#
# Usage (after the repo is public):
#
#   - uses: c3xdev/c3x@v0
#     with:
#       path: plan.json          # or a Terraform directory
#       comment: true            # post/update the PR comment
#       budget: "1000"           # gate on the absolute monthly total
#
# Gate on the per-PR increase (independent of budget). budget-delta
# fails the job when this PR raises the monthly total by more than the
# given amount versus the base branch:
#
#   - uses: c3xdev/c3x@v0
#     with:
#       path: .
#       budget-delta: "50"       # fail if this PR adds > $50/mo
#
# Or install-only (run c3x yourself afterwards):
#
#   - uses: c3xdev/c3x@v0
#     with:
#       install-only: true
#   - run: c3x estimate --path .
#
# Branded comments (post as c3x-cloud[bot] instead of github-actions):
# install the c3x-cloud GitHub App on the repo and grant id-token in the
# workflow, then set branded-comments: true:
#
#   permissions:
#     pull-requests: write
#     id-token: write          # required to mint the branded token
#   steps:
#     - uses: c3xdev/c3x@v0
#       with:
#         path: .
#         branded-comments: true
# Display name on the GitHub Marketplace; "c3x" alone is taken by a
# GitHub account. Workflows reference the action as c3xdev/c3x@v0.
name: C3X Cost Estimation
description: >-
  Cloud cost estimates for Terraform, OpenTofu and CloudFormation, posted on
  every pull request. No API key.
branding:
  icon: dollar-sign
  color: blue

inputs:
  version:
    description: c3x version to install (e.g. v0.1.0). "latest" resolves the newest release.
    default: latest
  install-only:
    description: Only install the binary; skip the estimate.
    default: "false"
  path:
    description: Terraform directory, plan JSON, or CloudFormation template.
    default: "."
  comment:
    description: Post/update the cost comment on the current PR (needs pull-requests write).
    default: "true"
  branded-comments:
    description: >-
      Post the PR comment as c3x-cloud[bot] instead of github-actions.
      "auto" does so when the C3X Cloud GitHub App is installed on the repo
      and the workflow grants 'permissions: id-token: write', and otherwise
      posts as github-actions without a warning. "true" warns when it can't;
      "false" never tries (no request to token.c3x.dev).
    default: "auto"
  token-service:
    description: C3X Cloud token service URL (advanced; default token.c3x.dev).
    default: "https://token.c3x.dev"
  budget:
    description: Fail when the monthly total exceeds this amount (0 disables).
    default: "0"
  budget-delta:
    description: >-
      Fail when this PR *increases* the monthly total by more than this
      amount versus the base branch (0 disables). Independent of budget.
    default: "0"
  format:
    description: Output format for the workflow log (text, markdown, json, junit, html, csv, sarif).
    default: text
  currency:
    description: Display currency (USD, EUR, GBP, ...).
    default: ""
  strict:
    description: >-
      Fail when any part of the estimate rests on an assumption (a price
      from another region, usage not provided, an attribute that could not
      be evaluated). The comment is still posted, with the caveats listed.
    default: "false"
  untrusted:
    description: >-
      Treat the input as untrusted (--no-remote-modules): no remote module
      fetches, no file functions, and the repository's .c3x.toml may not
      redirect pricing or file access. "auto" enables it for pull requests
      from forks, whose content you do not control; "true" / "false" force it.
    default: auto

runs:
  using: composite
  steps:
    - name: Install c3x
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        # The job's own token: authenticated API calls get the per-repo
        # limit instead of the anonymous 60 an hour shared by every job on
        # the runner's IP, which is what returned 403 (#96).
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REPO=c3xdev/c3x

        if [ "$VERSION" = "latest" ]; then
          VERSION=""
          if command -v gh >/dev/null 2>&1; then
            VERSION=$(gh release view --repo "$REPO" --json tagName --jq .tagName 2>/dev/null || true)
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -fsSL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/$REPO/releases/latest" 2>/dev/null \
              | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4 || true)
          fi
          if [ -z "$VERSION" ]; then
            # No API at all: github.com redirects /releases/latest to the
            # tag's page, which is not subject to API rate limits.
            VERSION=$(curl -fsSL --retry 3 -o /dev/null -w '%{url_effective}' \
              "https://github.com/$REPO/releases/latest" | sed -n 's#.*/tag/##p')
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::could not resolve the latest c3x release; set the version input (e.g. version: v0.3.12) to skip the lookup"
            exit 1
          fi
        fi

        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m); case "$ARCH" in x86_64) ARCH=amd64;; aarch64|arm64) ARCH=arm64;; esac

        # Tool cache: persists across jobs on self-hosted runners, so a
        # verified binary is downloaded once per version.
        CACHE_ROOT="${RUNNER_TOOL_CACHE:-${RUNNER_TEMP:-/tmp}}"
        DEST="$CACHE_ROOT/c3x/${VERSION#v}/$ARCH"
        if [ -x "$DEST/c3x" ] && [ -f "$DEST.complete" ]; then
          echo "Using cached c3x ${VERSION} (${OS}/${ARCH})"
        else
          ASSET="c3x_${VERSION#v}_${OS}_${ARCH}.tar.gz"
          echo "Installing c3x ${VERSION} (${OS}/${ARCH})"
          WORK=$(mktemp -d)
          if command -v gh >/dev/null 2>&1 \
             && gh release download "$VERSION" --repo "$REPO" --dir "$WORK" \
                  --pattern "$ASSET" --pattern checksums.txt >/dev/null 2>&1; then
            :
          else
            BASE="https://github.com/$REPO/releases/download/${VERSION}"
            curl -fsSL --retry 3 -o "$WORK/$ASSET" "$BASE/$ASSET"
            curl -fsSL --retry 3 -o "$WORK/checksums.txt" "$BASE/checksums.txt"
          fi
          # Verify before anything runs. A missing entry is a failure, not a
          # skip: installing an unverified binary is what this step prevents.
          EXPECTED=$(awk -v f="$ASSET" '$2 == f { print $1 }' "$WORK/checksums.txt")
          if [ -z "$EXPECTED" ]; then
            echo "::error::no checksum for $ASSET in checksums.txt"; exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL=$(sha256sum "$WORK/$ASSET" | awk '{print $1}')
          else
            ACTUAL=$(shasum -a 256 "$WORK/$ASSET" | awk '{print $1}')
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::checksum mismatch for $ASSET (expected $EXPECTED, got $ACTUAL)"; exit 1
          fi
          mkdir -p "$DEST"
          tar -xzf "$WORK/$ASSET" -C "$DEST" c3x
          touch "$DEST.complete"
          rm -rf "$WORK"
        fi
        # On PATH for the rest of the job, including the user's own steps.
        echo "$DEST" >> "$GITHUB_PATH"
        "$DEST/c3x" --version

    - name: Untrusted-input mode
      if: inputs.install-only != 'true'
      shell: bash
      env:
        UNTRUSTED: ${{ inputs.untrusted }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork || 'false' }}
      run: |
        set -euo pipefail
        if [ "$UNTRUSTED" = "true" ] || { [ "$UNTRUSTED" = "auto" ] && [ "$IS_FORK" = "true" ]; }; then
          # Exported to every later step, including your own c3x calls.
          echo "C3X_NO_REMOTE_MODULES=true" >> "$GITHUB_ENV"
          echo "c3x: untrusted-input mode on (pull request from a fork, or untrusted: true)"
        fi

    - name: Estimate
      if: inputs.install-only != 'true'
      shell: bash
      env:
        IN_PATH: ${{ inputs.path }}
        IN_FORMAT: ${{ inputs.format }}
        IN_BUDGET: ${{ inputs.budget }}
        IN_CURRENCY: ${{ inputs.currency }}
        IN_STRICT: ${{ inputs.strict }}
        IN_COMMENT: ${{ inputs.comment }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        ARGS=(estimate --path "$IN_PATH" --format "$IN_FORMAT")
        # When a PR comment will be posted, every gate (strict, budget,
        # budget-delta) is enforced after posting, so the pull request that
        # breaks a gate still gets the comment explaining why. --budget 0
        # also switches off a budget set in the repo's .c3x.toml here; the
        # Budget gate step applies it after the comment.
        WILL_COMMENT=false
        if [ "$IN_COMMENT" = "true" ] && [ "$EVENT_NAME" = "pull_request" ]; then
          WILL_COMMENT=true
        fi
        if [ "$WILL_COMMENT" = "true" ]; then
          ARGS+=(--budget 0)
        else
          if [ "$IN_STRICT" = "true" ]; then
            ARGS+=(--strict)
          fi
          if [ "$IN_BUDGET" != "0" ]; then
            ARGS+=(--budget "$IN_BUDGET")
          fi
        fi
        if [ -n "$IN_CURRENCY" ]; then
          ARGS+=(--currency "$IN_CURRENCY")
        fi
        c3x "${ARGS[@]}"

    - name: Base-branch baseline
      id: baseline
      if: inputs.install-only != 'true' && github.event_name == 'pull_request' && (inputs.comment == 'true' || inputs.budget-delta != '0')
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        IN_PATH: ${{ inputs.path }}
        IN_CURRENCY: ${{ inputs.currency }}
      run: |
        # Estimate the PR's BASE branch so the comment / gate can report
        # the delta this PR introduces ("+$144 vs main") rather than the
        # absolute total. Best-effort: when no baseline can be computed the
        # comment falls back to the absolute estimate, and the reason is
        # printed here.
        set -uo pipefail
        out=/tmp/c3x-base.json
        log=/tmp/c3x-base.log

        # An absolute path (e.g. ${{ github.workspace }}/infra) must be made
        # relative to the checkout to find the same path on the base branch.
        rel="$IN_PATH"
        case "$rel" in
          "$GITHUB_WORKSPACE"/*) rel="${rel#"$GITHUB_WORKSPACE"/}" ;;
          "$GITHUB_WORKSPACE") rel="." ;;
          /*) echo "::notice::path '$IN_PATH' is outside the workspace, so there is no base-branch copy to estimate; the comment shows the absolute total"
              exit 0 ;;
        esac

        if ! git fetch --no-tags --depth=1 origin "$BASE_SHA" >"$log" 2>&1 \
           || ! git worktree add --detach /tmp/c3x-base "$BASE_SHA" >>"$log" 2>&1; then
          echo "::warning::could not check out the base branch ($BASE_SHA); the comment shows the absolute total. git said: $(tail -n 1 "$log")"
          exit 0
        fi
        trap 'git worktree remove --force /tmp/c3x-base >/dev/null 2>&1 || true' EXIT

        base_path="/tmp/c3x-base/$rel"
        if [ ! -e "$base_path" ]; then
          if [ -f "$rel" ] && [ "${rel##*.}" = "json" ]; then
            # A plan generated in CI has no base-branch copy. That is fine:
            # the plan carries its own prior state, and the comment and the
            # budget-delta gate diff against it.
            echo "Plan JSON input: the delta comes from the plan's own prior state"
            exit 0
          fi
          # New in this PR: nothing existed before, so everything is added.
          printf '{"costs":[],"project_total":"0","currency":"%s"}\n' "${IN_CURRENCY:-USD}" > "$out"
          echo "baseline=$out" >> "$GITHUB_OUTPUT"
          echo "'$rel' does not exist on the base branch; baseline is \$0"
          exit 0
        fi

        # --budget 0: a base branch already over a budget set in its
        # .c3x.toml must still produce a baseline.
        if c3x estimate --path "$base_path" --budget 0 ${IN_CURRENCY:+--currency "$IN_CURRENCY"} \
             --save-baseline "$out" >"$log" 2>&1; then
          echo "baseline=$out" >> "$GITHUB_OUTPUT"
          echo "Computed cost baseline from base $BASE_SHA"
        else
          reason=$(grep -m1 -E '^(c3x: |Error: )' "$log" || tail -n 1 "$log")
          echo "::warning::base-branch estimate failed, so the comment shows the absolute total: ${reason}"
          echo "::group::c3x output for the base branch ($BASE_SHA)"
          cat "$log"
          echo "::endgroup::"
        fi

    - name: PR comment
      if: inputs.install-only != 'true' && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_DEFAULT_TOKEN: ${{ github.token }}
        BRANDED: ${{ inputs.branded-comments }}
        TOKEN_SERVICE: ${{ inputs.token-service }}
        OIDC_AUDIENCE: c3x-cloud
        IN_PATH: ${{ inputs.path }}
        BASELINE: ${{ steps.baseline.outputs.baseline }}
        IN_STRICT: ${{ inputs.strict }}
        IN_CURRENCY: ${{ inputs.currency }}
      run: |
        set -euo pipefail
        # c3x comment has no --currency flag; the config layer reads it
        # from C3X_CURRENCY. Exported only when set, so the repo's
        # .c3x.toml currency still applies otherwise.
        if [ -n "$IN_CURRENCY" ]; then export C3X_CURRENCY="$IN_CURRENCY"; fi
        TOKEN="$GH_DEFAULT_TOKEN"
        # Branded comments ask token.c3x.dev for a short-lived token of the
        # C3X Cloud app, scoped to this one repository. The request carries
        # a GitHub OIDC token whose audience is c3x-cloud, so it cannot be
        # used anywhere else; the service verifies it and stores nothing.
        # "auto" only asks when the workflow already grants id-token: write,
        # and falls back quietly: most repos don't have the app installed.
        APP_URL="https://github.com/apps/c3x-cloud"
        HAS_OIDC=false
        if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          HAS_OIDC=true
        fi
        if [ "$BRANDED" = "true" ] || { [ "$BRANDED" = "auto" ] && [ "$HAS_OIDC" = "true" ]; }; then
          # Any failure here is non-fatal: fall back to the default
          # github-actions identity rather than dropping the comment.
          branded=""
          err=""
          if [ "$HAS_OIDC" = "true" ]; then
            oidc=$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" 2>/dev/null | jq -r '.value // empty' || true)
            if [ -n "$oidc" ]; then
              resp=$(curl -sS --max-time 15 -X POST "$TOKEN_SERVICE" \
                -H "Authorization: Bearer ${oidc}" \
                -H 'Content-Type: application/json' \
                -d "{\"repo\":\"${GITHUB_REPOSITORY}\"}" 2>/dev/null || true)
              branded=$(printf '%s' "$resp" | jq -r '.token // empty' 2>/dev/null || true)
              err=$(printf '%s' "$resp" | jq -r '.error // empty' 2>/dev/null || true)
            else
              err="could not obtain OIDC token"
            fi
          else
            err="workflow is missing 'permissions: id-token: write'"
          fi
          if [ -n "$branded" ]; then
            echo "::add-mask::$branded"
            TOKEN="$branded"
            echo "Posting comment as c3x-cloud[bot]"
          elif [ "$BRANDED" = "true" ]; then
            echo "::warning::branded comment unavailable (${err:-unknown}); posting as github-actions instead"
          else
            echo "Posting as github-actions. To post as c3x-cloud[bot], install the C3X Cloud app: $APP_URL"
          fi
        elif [ "$BRANDED" = "auto" ]; then
          echo "Posting as github-actions. To post as c3x-cloud[bot], install the C3X Cloud app ($APP_URL) and grant 'permissions: id-token: write'."
        fi
        ARGS=(comment github --path "$IN_PATH")
        if [ "$IN_STRICT" = "true" ]; then
          ARGS+=(--strict)
        fi
        if [ -n "$BASELINE" ]; then
          # A baseline was computed from the base branch — post the delta.
          ARGS+=(--baseline "$BASELINE")
        fi
        GITHUB_TOKEN="$TOKEN" c3x "${ARGS[@]}"

    # Gates run after the comment, so a pull request that breaks one still
    # gets the comment that explains why. (strict is applied by the comment
    # step itself, after posting.)
    - name: Budget delta gate
      if: inputs.install-only != 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        IN_PATH: ${{ inputs.path }}
        BASELINE: ${{ steps.baseline.outputs.baseline }}
        IN_BUDGET_DELTA: ${{ inputs.budget-delta }}
        IN_CURRENCY: ${{ inputs.currency }}
      run: |
        set -euo pipefail
        if [ -n "$IN_CURRENCY" ]; then export C3X_CURRENCY="$IN_CURRENCY"; fi
        # Without the input, c3x diff still applies budget_delta from the
        # repo's .c3x.toml, if any; passing 0 would switch that off.
        GATE=()
        if [ "$IN_BUDGET_DELTA" != "0" ]; then GATE=(--budget-delta "$IN_BUDGET_DELTA"); fi
        if [ -n "$BASELINE" ]; then
          c3x diff --path "$IN_PATH" --baseline "$BASELINE" ${GATE[@]+"${GATE[@]}"} >/dev/null
        elif [ -f "$IN_PATH" ] && [ "${IN_PATH##*.}" = "json" ]; then
          # A plan JSON is generated in CI, so the base branch has no copy
          # to estimate; the plan's own prior state is the baseline.
          c3x diff --path "$IN_PATH" ${GATE[@]+"${GATE[@]}"} >/dev/null
        elif [ "$IN_BUDGET_DELTA" != "0" ]; then
          echo "::warning::budget-delta was not enforced: no base-branch estimate could be computed"
        fi

    - name: Budget gate
      # Only when the Estimate step skipped it to let the comment through.
      if: inputs.install-only != 'true' && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        IN_PATH: ${{ inputs.path }}
        IN_BUDGET: ${{ inputs.budget }}
        IN_CURRENCY: ${{ inputs.currency }}
      run: |
        set -euo pipefail
        ARGS=(estimate --path "$IN_PATH" --format json)
        if [ "$IN_BUDGET" != "0" ]; then ARGS+=(--budget "$IN_BUDGET"); fi
        if [ -n "$IN_CURRENCY" ]; then ARGS+=(--currency "$IN_CURRENCY"); fi
        # Without the input, a budget in the repo's .c3x.toml applies.
        c3x "${ARGS[@]}" >/dev/null
