# goreleaser configuration for c3x.
#
# Local dry-run (no publishing):
#   go run github.com/goreleaser/goreleaser/v2@latest release --snapshot --clean
# Config check:
#   go run github.com/goreleaser/goreleaser/v2@latest check
#
# Real releases run from .github/workflows/release.yml on v* tags.
version: 2

project_name: c3x

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: c3x
    main: ./cmd/c3x
    binary: c3x
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows/arm64 has negligible Terraform-CLI usage; skip to
      # halve the Windows build time.
      - goos: windows
        goarch: arm64

archives:
  - id: c3x
    ids: [c3x]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

# Homebrew cask (macOS) — `brews` formulae are deprecated in
# goreleaser v2. Casks are macOS-only; Linux users install via the
# install script or `go install`. Pushes Casks/c3x.rb to
# c3xdev/homebrew-tap so `brew install c3xdev/tap/c3x` works on macOS.
# Requires the HOMEBREW_RELEASE_TOKEN secret (a PAT with push access
# to the tap). Skipped automatically on snapshots.
homebrew_casks:
  - name: c3x
    repository:
      owner: c3xdev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_RELEASE_TOKEN }}"
    homepage: https://c3x.dev/
    description: "Cloud cost estimation for Terraform, OpenTofu and CloudFormation"
    license: Apache-2.0
    # Homebrew quarantines what a cask downloads, and Gatekeeper kills a
    # quarantined binary that is not notarized: `c3x` exited 137 on launch.
    # The binary is ad-hoc signed only, so drop the quarantine flag.
    # postflight_steps, not hooks (which emit the deprecated postflight).
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "c3x"], chdir: ".", writable_paths: ["c3x"]
        end
      end

# Docker images: dockers_v2 builds the multi-arch manifest natively
# (no per-arch image + manifest stitching needed). Published to both
# GHCR and Docker Hub; the Docker Hub coordinates come from the
# DOCKER_ORG / DOCKER_REPOSITORY release secrets (the workflow logs in
# to both registries before this runs). On a local snapshot without
# those env vars set, the docker step is skipped via --skip=docker.
dockers_v2:
  - id: c3x
    ids:
      - c3x
    images:
      - "ghcr.io/c3xdev/c3x"
      - "docker.io/{{ .Env.DOCKER_ORG }}/{{ .Env.DOCKER_REPOSITORY }}"
    tags:
      - "{{ .Version }}"
      - "latest"
    dockerfile: Dockerfile.release
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: "https://github.com/c3xdev/c3x"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: "Apache-2.0"

release:
  github:
    owner: c3xdev
    name: c3x
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```bash
    brew install c3xdev/tap/c3x
    go install github.com/c3xdev/c3x/cmd/c3x@{{ .Tag }}
    docker pull ghcr.io/c3xdev/c3x:{{ .Version }}
    ```
